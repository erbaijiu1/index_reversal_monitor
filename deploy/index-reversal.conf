# Add to /data/toc_service/nginx/locations/index-reversal.conf
location /index-reversal/api/ {
    proxy_pass http://index_reversal_backend:8096/index-reversal/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /index-reversal/ {
    alias /usr/share/nginx/html/index_reversal/;
    index index.html;
    try_files $uri $uri/ /index-reversal/index.html;
}
